services:
  - type: web
    name: zcos
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FRONTEND_URL
        value: "https://zcos.online"
      - key: ALLOWED_FRONTEND_ORIGINS
        value: "https://zcos.online,https://zar-ai.online"
      - key: VITE_API_BASE_URL
        value: "https://api.zcos.online"
      - key: VITE_ZAR_APP_URL
        value: "https://zar-ai.online"
      - key: ZAR_API_URL
        value: "https://api.zar-ai.online"
      - key: VITE_PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: ZCOS_ADMIN_SECURE_PHRASE
        sync: false
