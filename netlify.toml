[build]
  command = "npm install && npm run build:client"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  VITE_ZAR_APP_URL = "https://zar-ai.online"

[[redirects]]
  from = "/api/*"
  to = "https://api.zcos.online/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
